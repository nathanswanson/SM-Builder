apiVersion: v1
kind: Service
metadata:
  namespace: www
  name: frontend-service
  annotations:
    metallb.io/allow-shared-ip: "static-key-192.168.49.240"
spec:
  selector:
    app: frontend-deployment
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
