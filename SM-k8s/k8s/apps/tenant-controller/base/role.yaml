apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-controller-role
rules:
  # Permission to manage namespaces for tenant isolation
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumeclaims", "services"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  # Permission to manage deployments for game servers
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
