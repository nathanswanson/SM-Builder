apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: www
spec:
  serviceName: "postgresql"
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      # nodeSelector:
      #   role: core
      # tolerations:
      #   - key: "node-role.kubernetes.io/control-node"
      #     operator: "Exists"
      #     effect: "NoSchedule"
      containers:
        - name: postgresql
          image: postgres:18.0
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata-pvc
